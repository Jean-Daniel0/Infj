# Configuration Netlify pour l'Institut National de Formation des Jeunes
# ID du projet: 4e461cf8-c965-4f04-b3b6-8aa178c56541

[build]
  command = ""
  publish = "frontend"

[dev]
  command = ""
  port = 8888
  publish = "frontend"

# Redirections personnalisées (si nécessaire)
# Exemple: rediriger les anciennes URLs vers les nouvelles
# [[redirects]]
#   from = "/old-page"
#   to = "/new-page"
#   status = 301

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
